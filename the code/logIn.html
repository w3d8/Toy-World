<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Sign Up - Toy World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="py-4">
    <h1 class="text-white">Welcome to Toy World</h1>
  </header>

  <div class="container">
    <div class="content-background mx-auto mt-4 p-4" style="max-width: 500px;">
      
      <!-- Login Form -->
      <form id="loginForm">
        <h3>Login</h3>
        <div class="mb-3">
          <input type="email" class="form-control" id="loginEmail" name="loginEmail" placeholder="Email" required>
        </div>
        <div class="mb-3">
          <input type="password" class="form-control" id="loginPassword" name="loginPassword" placeholder="Password" required>
        </div>
        <button type="submit" class="btn w-100">Login</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signupForm" style="display: none;">
        <h3>Sign Up</h3>
        <div class="mb-2">
          <input type="text" class="form-control" id="signupUsername" name="signupUsername" placeholder="Username" required>
        </div>
        <div class="mb-2">
          <input type="email" class="form-control" id="signupEmail" name="signupEmail" placeholder="Email" required>
        </div>
        <div class="mb-2">
          <input type="password" class="form-control" id="signupPassword" name="signupPassword" placeholder="Password" required>
        </div>
        <div class="mb-2">
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
        </div>
        <div class="mb-3">
          <input type="tel" class="form-control" id="phoneNumber" name="phoneNumber" placeholder="Phone Number" required>
        </div>
        <button type="submit" class="btn w-100">Sign Up</button>
      </form>

      <button onclick="toggleForms()" class="btn w-100 mt-3">Switch Login / Sign Up</button>
      <p id="formMessage" class="mt-3 text-warning"></p>
      
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const signupForm = document.getElementById('signupForm');
    const formMessage = document.getElementById('formMessage');

    function toggleForms() {
      if (loginForm.style.display === 'none') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
      }
      formMessage.textContent = '';
    }

    // Handle Login Submit
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();
      if (email && password) {
        formMessage.textContent = "Logged in successfully 🎉";
        setTimeout(() => {
          window.location.href = "home.html";  // Redirect to the home page
        }, 1000);
      } else {
        formMessage.textContent = "Please fill in all fields!";
      }
    });

    // Handle Sign Up Submit
    signupForm.addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('signupUsername').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      if (password !== confirmPassword) {
        formMessage.textContent = "Passwords do not match!";
        return;
      }
      // You can add further client-side validation here if needed
      formMessage.textContent = "Account created successfully ✅";
      setTimeout(() => {
        window.location.href = "profile.html";  // Redirect to the profile page
      }, 1000);
    });
  </script>

</body>
</html>
