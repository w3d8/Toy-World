<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toy World - Menu 🎮</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <div class="container">
      <a class="navbar-brand" href="home.html">
        <img src="images/Toy World Logo.webp" alt="logo" style="max-height: 50px;">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
  
      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="home.html">Home 🏠</a></li>
          <li class="nav-item"><a class="nav-link" href="profile.html">Profile 👤</a></li>
          <li class="nav-item"><a class="nav-link active" href="index.html">Menu 🎮</a></li>
          <li class="nav-item"><a class="nav-link" href="faq.html">FAQ 🔍</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us 📞</a></li>
          <li class="nav-item"><a class="nav-link" href="logout.html">Logout 🔑</a></li>
        </ul>
      </div>
    </div>
  </nav>
  
  <!-- Main Content -->
  <div class="container mt-5 text-center">
    <h1><strong>Welcome to Toy World</strong></h1>
    <h2 class="mb-4">Select a toy category:</h2>

    <div class="category-buttons mb-4">
      <button class="btn btn-custom me-2" onclick="showProducts('digital')">Digital Toys</button>
      <button class="btn btn-custom me-2" onclick="showProducts('kid')">Kid Toys</button>
      <button class="btn btn-custom" onclick="showProducts('motion')">Motion Toys</button>
    </div>

    <div id="products" class="products-container"></div>
  </div>

  <!-- Cart Icon -->
  <div class="cart-icon position-fixed bottom-0 end-0 m-4 bg-light p-2 rounded shadow" onclick="toggleCart()" style="cursor: pointer;">
    🛒 <span id="cart-count">0</span>
  </div>

  <!-- Sidebar Cart -->
  <div id="cart-sidebar" class="cart-sidebar position-fixed top-0 end-0 bg-white border p-4 shadow">
    <button class="btn-close float-end" onclick="toggleCart()"></button>
    <h2>Shopping Cart</h2>
    <ul id="cart-items" class="list-unstyled"></ul>
    <p>Total Price: <strong><span id="total-price">0</span> SAR</strong></p>
  </div>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
